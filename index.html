<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mill Counter</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);padding:15px;color:#fff;min-height:100vh}
.container{max-width:500px;margin:auto}
h1{text-align:center;margin:10px 0 20px;font-size:24px}
.card{background:#ffffff22;backdrop-filter:blur(5px);border-radius:20px;padding:20px;margin-bottom:15px;overflow:hidden}
h3{margin-bottom:12px;font-size:18px}

.rates{display:grid;grid-template-columns:repeat(3, 1fr);gap:10px;margin-bottom:15px}
.rates input{width:100%;padding:12px;border:none;border-radius:12px;background:#ffffff33;color:#fff;font-size:16px}
.rates input::placeholder{color:#eee}

.btns{display:grid;grid-template-columns:repeat(3, 1fr);gap:10px;margin-bottom:10px}
.btns-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{padding:14px;border:none;border-radius:15px;font-size:15px;font-weight:600;cursor:pointer}
button:disabled{opacity:0.4;cursor:not-allowed}
.btn-full{background:#4CAF50;color:#fff}
.btn-noon{background:#FF9800;color:#fff}
.btn-night{background:#9C27B0;color:#fff}
.btn-undo{background:#f44336;color:#fff}
.btn-reset{background:#607D8B;color:#fff}

.summary{display:grid;grid-template-columns:repeat(3, 1fr);gap:10px;text-align:center}
.box{background:#ffffff33;padding:15px;border-radius:15px}
.box h2{font-size:24px;margin-bottom:4px}
.total{font-size:28px;text-align:center;margin-top:15px;font-weight:700}
.item{display:flex;justify-content:space-between;background:#ffffff22;padding:10px;border-radius:10px;margin-bottom:8px}
.date-input{width:100%;padding:12px;border:none;border-radius:12px;margin-bottom:10px;background:#ffffff33;color:#fff}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000;padding:12px 18px;border-radius:10px;display:none;z-index:999}
</style>
</head>
<body>
<div class="container">
<h1>📊 Mill Counter</h1>

<div class="card">
<h3>Set Rates</h3>
<div class="rates">
<input type="number" id="fullRate" value="100" placeholder="Full">
<input type="number" id="noonRate" value="70" placeholder="Noon">
<input type="number" id="nightRate" value="50" placeholder="Night">
</div>
<input type="date" id="date" class="date-input">
<div class="btns">
<button class="btn-full" id="btnFull" onclick="add('full')">+ Full Day</button>
<button class="btn-noon" id="btnNoon" onclick="add('noon')">+ Noon</button>
<button class="btn-night" id="btnNight" onclick="add('night')">+ Night</button>
</div>
<div class="btns-2">
<button class="btn-undo" onclick="undo()">↩ Undo Last</button>
<button class="btn-reset" onclick="reset()">🗑 Reset All</button>
</div>
</div>

<div class="card">
<h3>This Month</h3>
<div class="summary">
<div class="box"><h2 id="fullCount">0</h2><p>Full</p></div>
<div class="box"><h2 id="noonCount">0</h2><p>Noon</p></div>
<div class="box"><h2 id="nightCount">0</h2><p>Night</p></div>
</div>
<div class="total">Total: <span id="totalAmount">0</span> Tk</div>
</div>

<div class="card">
<h3>History</h3>
<div id="history"></div>
</div>
</div>

<div id="toast"></div>

<script>
let data = JSON.parse(localStorage.getItem('millDataV5')) || [];
const dateEl = document.getElementById('date');
const btnFull = document.getElementById('btnFull');
const btnNoon = document.getElementById('btnNoon');
const btnNight = document.getElementById('btnNight');
dateEl.valueAsDate = new Date();

function showToast(msg){
  const t = document.getElementById('toast');
  t.innerText = msg; 
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2000);
}

function save(){
  localStorage.setItem('millDataV5', JSON.stringify(data));
  updateUI();
}

function add(type){
  let selectedDate = dateEl.value;
  let alreadyExists = data.find(x => x.date === selectedDate);
  
  if(alreadyExists){
    showToast("❌ This date already has an entry. Undo first.");
    return;
  }
  
  data.push({date: selectedDate, type: type, ts: Date.now()});
  showToast("✅ " + type + " added");
  save();
}

function undo(){
  if(data.length === 0){
    showToast("Nothing to undo");
    return;
  }
  data.pop();
  showToast("↩ Last entry undone");
  save();
}

function reset(){
  if(confirm('Delete ALL data?')){
    data = [];
    save();
    showToast("🗑 All data deleted");
  }
}

function updateUI(){
  let f = +document.getElementById('fullRate').value;
  let n = +document.getElementById('noonRate').value;
  let ng = +document.getElementById('nightRate').value;

  let fc = data.filter(x => x.type === 'full').length;
  let nc = data.filter(x => x.type === 'noon').length;
  let ngc = data.filter(x => x.type === 'night').length;

  document.getElementById('fullCount').innerText = fc;
  document.getElementById('noonCount').innerText = nc;
  document.getElementById('nightCount').innerText = ngc;
  
  let total = fc * f + nc * n + ngc * ng;
  document.getElementById('totalAmount').innerText = total;

  // 1 Day = 1 Entry Rule: Disable buttons if date already has entry
  let selectedDate = dateEl.value;
  let existing = data.find(x => x.date === selectedDate);
  btnFull.disabled = btnNoon.disabled = btnNight.disabled = !!existing;

  document.getElementById('history').innerHTML = data.slice().reverse().map(x => {
    let label = x.type === 'full' ? 'Full' : x.type === 'noon' ? 'Noon' : 'Night';
    return `<div class="item"><span>${x.date}</span><span><b>${label}</b></span></div>`
  }).join('');
}

document.getElementById('fullRate').oninput = updateUI;
document.getElementById('noonRate').oninput = updateUI;
document.getElementById('nightRate').oninput = updateUI;
dateEl.onchange = updateUI;

updateUI();
</script>
</body>
</html>
